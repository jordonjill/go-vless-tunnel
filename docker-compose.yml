version: '3'

services:
  go-vless-tunnel:
    build: .
    container_name: go-vless-tunnel
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - go-vless-tunnel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  go-vless-tunnel-network:
    driver: bridge